name: 🚀 Deploy website on tag
on:
  push:
    tags:
      - '*'

jobs:
  build:
    if: github.event.base_ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0    # Fetch all history for .GitInfo and .Lastmod
      - name: ↧ Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - name: ↧ npm ci
        run: npm ci --ignore-scripts
      - name: ✔ Lint
        run: npm run lint
      - name: ⚛ Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: '0.169.0'
          extended: true
      - name: ↧ Install Dart Sass
        env:
          DART_SASS_VERSION: '1.108.1'
        run: |
          curl -fsSL "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
      - name: ⚙ Build
        run: npm run build
      - name: 𝍖 Create Index
        run: npm run index
      - name: 🏷️ Get tag name
        run: echo "TAG_NAME=$(echo ${GITHUB_REF#refs/*/} | tr / -)" >> $GITHUB_ENV
      - name: 📂 Archive
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: release-diff
          folder: public
          clean: true
          commit-message: Release ${{ env.TAG_NAME }}
      - name: 🎉 Deploy
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: mv-wollbach.de
          username: ${{ secrets.ftp_user }}
          password: ${{ secrets.ftp_password }}
          protocol: ftps
          local-dir: ./public/
          server-dir: /html/
          security: loose
          port: 21
